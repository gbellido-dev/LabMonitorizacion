# Broker MQTT general del laboratorio (Eclipse Mosquitto 2)
#
#   MQTT TCP        : 1883
#   MQTT WebSocket  : 9001
#
# Acceso anónimo para el aula. En una red no aislada, crea usuarios con
# mosquitto_passwd, pon allow_anonymous false y habilita TLS (8883).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Puente con el broker integrado de OceanLab: la telemetría de las boyas
# (oceanlab/#) también se puede consumir desde este broker central.
# ---------------------------------------------------------------------------
connection oceanlab
address oceanlab:1883
clientid mosquitto-puente-oceanlab
topic oceanlab/# in 1
cleansession true
try_private false
notifications false
restart_timeout 5 30
