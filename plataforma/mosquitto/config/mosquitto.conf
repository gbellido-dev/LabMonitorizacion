# Broker MQTT único del laboratorio (Eclipse Mosquitto 2)
#
# OceanLab publica aquí la telemetría de las boyas (oceanlab/#) y aquí se
# conectan Node-RED y cualquier cliente del aula (MQTT Explorer, ESP32...).
#
#   MQTT TCP        : 1883
#   MQTT WebSocket  : 9001
#
# Acceso anónimo para el aula. En una red no aislada, crea usuarios con
# mosquitto_passwd, pon allow_anonymous false y habilita TLS (8883).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
