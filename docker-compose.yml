# LabMonitorizacion · entorno integrado de prácticas de Monitorización de Máquinas
#
#   docker compose up -d --build
#
# (ThingsBoard se instala solo en el primer arranque; tarda unos minutos.)
#
# Simuladores                                   Plataforma IIoT
#   AeroLab    http://localhost:8010  Modbus 1502  Node-RED     http://localhost:1880
#   OceanLab   http://localhost:8020  (MQTT en     ThingsBoard  http://localhost:8080
#                                     Mosquitto)   Mosquitto    mqtt://localhost:1883  WS 9001
#   SolarLab   http://localhost:8000  OPC UA 4840  Copias       http://localhost:8090
#   Fundición  http://localhost:3000  OPC UA 4841
#
# Dentro de la red de Docker cada servicio se alcanza por su nombre
# (aerolab:1502, mosquitto:1883, solarlab:4840, fundicion-opcua:4841,
# thingsboard:1883 ...).

name: labmonitorizacion

services:
  # ------------------------------------------------------------------ simuladores
  aerolab:
    build: simuladores/aerolab
    image: labmonitorizacion/aerolab
    environment:
      MODBUS_HOST: 0.0.0.0
      MODBUS_PORT: 1502
    ports:
      - "8010:8010"   # web 3D + API
      - "1502:1502"   # Modbus TCP
    restart: unless-stopped

  oceanlab:
    build: simuladores/oceanlab
    image: labmonitorizacion/oceanlab
    depends_on:
      - mosquitto
    environment:
      # Publica en el broker único del laboratorio en lugar de su broker integrado
      BUOYLAB_MQTT_EXTERNAL_HOST: mosquitto
      BUOYLAB_MQTT_EXTERNAL_PORT: 1883
      BUOYLAB_MQTT_PUBLIC_WS_PORT: 9001
    ports:
      - "8020:8020"   # web 3D + API
    restart: unless-stopped

  solarlab:
    build: simuladores/solarlab
    image: labmonitorizacion/solarlab
    environment:
      OPCUA_PUBLIC_HOST: ${LAB_PUBLIC_HOST:-localhost}
    ports:
      - "8000:8000"   # web 3D + API
      - "4840:4840"   # OPC UA
    restart: unless-stopped

  fundicion-web:
    build: simuladores/fundicion
    image: labmonitorizacion/fundicion
    command: ["npm", "run", "start", "--", "--host", "0.0.0.0"]
    ports:
      - "3000:3000"   # gemelo digital 3D
    restart: unless-stopped

  fundicion-opcua:
    build: simuladores/fundicion
    image: labmonitorizacion/fundicion
    command: ["npm", "run", "opcua"]
    environment:
      OPCUA_PORT: 4841   # 4840 lo usa SolarLab
      OPCUA_ALTERNATE_HOSTNAME: ${LAB_PUBLIC_HOST:-localhost}
    ports:
      - "4841:4841"   # OPC UA  opc.tcp://localhost:4841/UA/Fundicion
    restart: unless-stopped

  fundicion-bridge:
    build: simuladores/fundicion
    image: labmonitorizacion/fundicion
    command: ["npm", "run", "opcua:bridge"]
    depends_on:
      - fundicion-opcua
    environment:
      OPCUA_ENDPOINT: opc.tcp://fundicion-opcua:4841/UA/Fundicion
    ports:
      - "8081:8081"   # WebSocket que consume el dashboard 3D
    restart: unless-stopped

  # ------------------------------------------------------------- plataforma IIoT
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./plataforma/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT sobre WebSocket
    restart: unless-stopped

  nodered:
    build: plataforma/node-red
    image: labmonitorizacion/node-red
    environment:
      TZ: Europe/Madrid
      # true = la biblioteca de Node-RED incluye también los flujos resueltos
      NODE_RED_INCLUIR_SOLUCIONES: ${NODE_RED_INCLUIR_SOLUCIONES:-false}
    volumes:
      - nodered-data:/data
    ports:
      - "1880:1880"   # editor y /dashboard
    restart: unless-stopped

  thingsboard:
    # tb-node 4.3.1 + instalación automática de la base de datos en el primer arranque
    build: plataforma/thingsboard
    image: labmonitorizacion/thingsboard:4.3.1
    depends_on:
      tb-postgres:
        condition: service_healthy
    environment:
      TB_SERVICE_ID: tb-ce-node
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://tb-postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${TB_DB_PASSWORD:-postgres}
      TB_LOAD_DEMO: "true"   # cuentas tenant@thingsboard.org / customer@...
    volumes:
      - tb-logs:/var/log/thingsboard
    ports:
      - "8080:8080"   # web y API REST
      # Su MQTT (API de dispositivos, no un broker general) solo se usa dentro
      # de Docker: Node-RED publica en thingsboard:1883.
    restart: unless-stopped

  tb-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${TB_DB_PASSWORD:-postgres}
    volumes:
      - tb-postgres-data:/var/lib/postgresql/data
      - copias-intercambio:/intercambio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------- copias de seguridad (web)
  copias:
    build: plataforma/copias
    image: labmonitorizacion/copias
    environment:
      COMPOSE_PROJECT: labmonitorizacion
    volumes:
      # Necesita Docker para parar/arrancar servicios y lanzar pg_dump/pg_restore
      - /var/run/docker.sock:/var/run/docker.sock
      - copias:/snapshots
      - nodered-data:/nodered-data
      - copias-intercambio:/intercambio
    ports:
      # Solo accesible desde este equipo: quien la use puede borrar y restaurar
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

volumes:
  mosquitto-data:
  nodered-data:
  tb-logs:
  tb-postgres-data:
  copias:
  copias-intercambio:
